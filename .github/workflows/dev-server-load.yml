name: Dev server load

on:
  pull_request:
  workflow_dispatch:
    inputs:
      variants:
        description: Comma-separated variant ids, or "all". Blank uses the script's default.
      repeats:
        description: Healthy 200s wanted per route. Blank uses the script's default.

# Keyed on the pull request rather than the ref, falling back to a run id that
# never repeats, so a manual dispatch neither cancels a pull request's run nor
# gets cancelled by one. A dispatch is usually a measurement someone is waiting
# on, and every leg here costs minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# This file holds only what GitHub Actions has to own: the triggers, the shared
# steps, and the order the jobs run in. Which machines run, which node versions,
# which reproduction each leg measures, what it measures and how the report
# reaches the pull request all live in repro/plan.mjs and the scripts it calls,
# so adding a leg or a whole reproduction does not touch this file.
jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - uses: actions/checkout@v4
      - id: legs
        run: node repro/plan.mjs --matrix >> "$GITHUB_OUTPUT"

  leg:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - uses: actions/checkout@v4

      # There is no package.json at the repository root, so the action has to be
      # told which reproduction's pnpm version to install.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.dir }}/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml

      # No --ignore-scripts: the postinstall is what fetches the platform workerd binary.
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.dir }}

      # One entrypoint for every leg. It reads the id, not a command, so nothing
      # from the matrix reaches a shell.
      # bash on every runner: on Windows the default shell is PowerShell, where
      # "$LEG" expands to nothing instead of the environment variable.
      - name: Measure
        shell: bash
        env:
          LEG: ${{ matrix.id }}
          VARIANTS: ${{ inputs.variants }}
          REPEATS: ${{ inputs.repeats }}
        run: node repro/plan.mjs --run="$LEG"

      - name: Dev server daemon log
        if: always()
        shell: bash
        run: cat "${{ matrix.dir }}/.astro/dev.log" 2>/dev/null || echo "no dev.log for this leg"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.id }}
          path: ${{ matrix.dir }}/results/*.json
          if-no-files-found: warn

  report:
    name: comparison
    needs: [plan, leg]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Everything every leg uploaded, with no pattern, so a new kind of
      # measurement only has to write JSON and the report works out what it is.
      - uses: actions/download-artifact@v4
        with:
          path: results
          merge-multiple: true

      - name: Compare and report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node repro/plan.mjs --report

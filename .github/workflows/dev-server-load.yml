name: Dev server load

on:
  pull_request:
  workflow_dispatch:
    inputs:
      variants:
        description: Comma-separated variant ids, or "all"
        default: baseline,optimizedeps-include
      repeats:
        description: Healthy 200s wanted per route
        default: "3"

jobs:
  measure:
    name: ${{ matrix.os }} node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # No --ignore-scripts: the postinstall is what fetches the platform workerd binary.
      - run: pnpm install --frozen-lockfile

      - name: Measure
        shell: bash
        env:
          VARIANTS: ${{ inputs.variants || 'baseline,optimizedeps-include' }}
          REPEATS: ${{ inputs.repeats || '3' }}
          LEG: ${{ matrix.os }}-node${{ matrix.node }}
        run: |
          node scripts/dev-load.mjs \
            --label="$LEG" \
            --variants="$VARIANTS" \
            --repeats="$REPEATS" \
            --out="dev-load-$LEG.json"

      - name: Dev server daemon log
        if: always()
        shell: bash
        run: cat .astro/dev.log || echo "no .astro/dev.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-load-${{ matrix.os }}-node${{ matrix.node }}
          path: dev-load-${{ matrix.os }}-node${{ matrix.node }}.json
          if-no-files-found: warn

  report:
    name: comparison
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: dev-load-*
          merge-multiple: true

      - run: node scripts/dev-load.mjs --compare=results

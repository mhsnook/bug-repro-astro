name: Dev server load

on:
  pull_request:
  workflow_dispatch:
    inputs:
      variants:
        description: Comma-separated variant ids, or "all"
        default: baseline,optimizedeps-include
      repeats:
        description: Healthy 200s wanted per route
        default: "3"

jobs:
  measure:
    name: ${{ matrix.os }} node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # No --ignore-scripts: the postinstall is what fetches the platform workerd binary.
      - run: pnpm install --frozen-lockfile

      - name: Measure
        shell: bash
        env:
          VARIANTS: ${{ inputs.variants || 'baseline,optimizedeps-include' }}
          REPEATS: ${{ inputs.repeats || '3' }}
          LEG: ${{ matrix.os }}-node${{ matrix.node }}
        run: |
          node scripts/dev-load.mjs \
            --label="$LEG" \
            --variants="$VARIANTS" \
            --repeats="$REPEATS" \
            --out="dev-load-$LEG.json"

      - name: Dev server daemon log
        if: always()
        shell: bash
        run: cat .astro/dev.log || echo "no .astro/dev.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-load-${{ matrix.os }}-node${{ matrix.node }}
          path: dev-load-${{ matrix.os }}-node${{ matrix.node }}.json
          if-no-files-found: warn

  report:
    name: comparison
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: dev-load-*
          merge-multiple: true

      - name: Compare
        run: node scripts/dev-load.mjs --compare=results | tee report.md

      - name: Post the table on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER='<!-- dev-load-report -->'
          {
            echo "$MARKER"
            cat report.md
            echo
            echo "[Run ${{ github.run_number }}]($RUN_URL) on \`${{ github.event.pull_request.head.sha }}\`."
          } > comment.md
          # Edit the existing comment rather than stacking one per push.
          ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$MARKER\"))] | .[0].id // empty" | head -n1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@comment.md
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md
          fi

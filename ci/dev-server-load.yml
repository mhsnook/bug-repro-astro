name: Dev server load

on:
  pull_request:
  workflow_dispatch:
    inputs:
      variants:
        description: Comma-separated variant ids, or "all". Blank uses the script's default.
      repeats:
        description: Healthy 200s wanted per route. Blank uses the script's default.

# Everything below is wiring: triggers, the matrix, and the steps. What gets
# measured, which variants run by default, how many samples, how it is judged
# and how the report reaches the pull request all live in repro-scripts/dev-load.mjs.
# Blank inputs pass straight through, so the defaults are the script's and this
# file does not carry a copy of them.
jobs:
  measure:
    name: ${{ matrix.os }} node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # No --ignore-scripts: the postinstall is what fetches the platform workerd binary.
      - run: pnpm install --frozen-lockfile

      - name: Measure
        shell: bash
        env:
          VARIANTS: ${{ inputs.variants }}
          REPEATS: ${{ inputs.repeats }}
        run: node repro-scripts/dev-load.mjs --variants="$VARIANTS" --repeats="$REPEATS"

      - name: Dev server daemon log
        if: always()
        shell: bash
        run: cat .astro/dev.log || echo "no .astro/dev.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-load-${{ matrix.os }}-node${{ matrix.node }}
          path: dev-load-*.json
          if-no-files-found: warn

  # The bare reproduction in repro/bare-cloudflare-vite has no framework and no
  # bindings. It counts how often a plugin's hotUpdate hook runs while nothing is
  # edited, which is a property of the platform's file watcher, so it is measured
  # per OS rather than assumed.
  watcher:
    name: watcher events on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: repro/bare-cloudflare-vite
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Count hotUpdate hooks fired with nothing edited
        run: node count-hot-updates.mjs --out="watcher-${{ matrix.os }}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watcher-${{ matrix.os }}
          path: repro/bare-cloudflare-vite/watcher-*.json
          if-no-files-found: warn

  report:
    name: comparison
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: dev-load-*
          merge-multiple: true

      - name: Compare and report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node repro-scripts/dev-load.mjs --compare=results --comment
